<script>
const NOMBRE = 'txoko<b>Pay</b>';
const SOCIEDAD = {nombre:'Sociedad gastronómica de ejemplo', sub:'sglosllanos.txokopay.com'};
/* Demo: en la aplicación real la nube NO guarda el DNI, solo una huella lenta; aquí se comprueba en el propio navegador con datos inventados */
const SOCIOS = {23:{nombre:'Josu Etxeberria', dni:'12345678Z'}, 7:{nombre:'Mikel Aranburu', dni:'87654321X'}, 12:{nombre:'Iñaki Goikoetxea', dni:'11223344B'}};
const FRANJAS = [
  {id:'almuerzo', nombre:'Almuerzo', desde:'09:00', hasta:'12:00', max:20},
  {id:'comida',   nombre:'Comida',   desde:'12:00', hasta:'17:00', max:40},
  {id:'merienda', nombre:'Merienda', desde:'17:00', hasta:'19:00', max:15},
  {id:'cena',     nombre:'Cena',     desde:'19:00', hasta:'02:00', max:40}
];
const MAQ = [{id:'horno1',nombre:'Horno 1'},{id:'horno2',nombre:'Horno 2'},{id:'freidora',nombre:'Freidora'}];
const HORAS_SESION = 2, MAX_INTENTOS = 5, ANTELACION_DIAS = 30;
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'], MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clave = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const deClave = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const hoy = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const sumar = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtDia = k => { const d = deClave(k); return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()]; };
const HOYK = clave(hoy());
const DIA_CERRADO = clave(sumar(hoy(), 4));   /* ejemplo: un día cerrado por un evento de la sociedad */
const hash = s => { let h = 7; for (const c of s) h = (h*31 + c.charCodeAt(0)) >>> 0; return h; };

/* ---------- Lo que ya hay reservado en la sociedad (lo publica el servidor) ---------- */
const OTRAS = [];   /* reservas hechas en esta demo por otros socios que ocupan plazas o máquinas */
function ocupadosBase(dia, fr){ return Math.round((hash(dia+fr.id) % 100) / 100 * fr.max * 0.75); }
function maqBase(dia, fr, m){ return (hash(dia+fr.id+m.id) % 5) === 0; }
function usadas(dia, fr){ return S.reservas.filter(r => r.dia===dia && r.franja===fr.id && (r.estado==='confirmada'||r.estado==='solicitada')); }
const plazasLibres = (dia, fr) => Math.max(0, fr.max - ocupadosBase(dia, fr) - usadas(dia, fr).reduce((s,r)=>s+r.comensales,0));
const maqOcupada = (dia, fr, m) => maqBase(dia, fr, m) || usadas(dia, fr).some(r => r.maq.includes(m.id));
/* Cuántas reservas y cuántos comensales hay ya en cada turno (lo publica el servidor): las de la sociedad (inventadas) más las de esta demo */
function statsFranja(dia, fr){ const ob = ocupadosBase(dia, fr), u = usadas(dia, fr); return {res:(ob > 0 ? Math.max(1, Math.round(ob / 6)) : 0) + u.length, com:ob + u.reduce((s, r) => s + r.comensales, 0)}; }
const totalDia = dia => FRANJAS.reduce((s, f) => s + statsFranja(dia, f).com, 0);
/* ---------- «Redis» de la demo: la copia compartida entre la sociedad (txokoPay) y la web ---------- */
/* Cada día+turno lleva un número de versión que sube con CUALQUIER cambio (reserva nueva, confirmación, anulación, la TPV, el panel…).
   La web descarga lo existente antes de reservar y, al escribir, comprueba que la versión no haya subido mientras tanto: si ha subido, error y vuelta a descargar. */
const NUBE = {vers:{}};
const vk = (d, f) => d + '|' + f;
const ver = (d, f) => NUBE.vers[vk(d, f)] || 0;
const sube = (d, f) => { NUBE.vers[vk(d, f)] = ver(d, f) + 1; };
const log = (tipo, txt) => { S.log.unshift({tipo, txt, h:new Date().toLocaleTimeString('es-ES')}); S.log = S.log.slice(0, 40); };
/* ---------- Estado ---------- */
let _idr = 214;
const S = {fase:'login', num:'', dni:'', error:'', aviso:'', socio:0, hasta:0, tab:'nueva', completa:false,
  dia:'', franja:'', com:2, maq:[], conectado:true, intentos:{}, bloqueo:{}, reservas:[], anularId:null, enviada:null};
const cargar = () => { try { const g = JSON.parse(localStorage.getItem('txoko_reservas_demo')||'null'); if (g){ S.reservas = g.reservas||[]; _idr = g.idr||_idr; if (g.socio && SOCIOS[g.socio] && g.hasta > Date.now()){ S.socio=g.socio; S.hasta=g.hasta; S.fase='app'; } } } catch(e){} };
const guardar = () => { try { localStorage.setItem('txoko_reservas_demo', JSON.stringify({reservas:S.reservas, idr:_idr, socio:S.fase==='app'?S.socio:0, hasta:S.hasta})); } catch(e){} };
cargar();
const misReservas = () => S.reservas.filter(r => r.socio === S.socio).sort((a,b) => a.dia < b.dia ? 1 : a.dia > b.dia ? -1 : b.creada - a.creada);
S.vistas = {}; S.snap = {}; S.sync = 0; S.log = []; S.errNueva = ''; S.editId = null; S.edit = null; S.errEdit = ''; S.mes = '';
const MESESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
/* Descarga lo que hay en la sociedad para un día: plazas libres y aparatos cogidos de cada turno + las versiones */
function descargar(dia, motivo){
  if (!dia) return;
  S.snap[dia] = {};
  FRANJAS.forEach(f => {
    S.vistas[vk(dia, f.id)] = ver(dia, f.id);
    S.snap[dia][f.id] = {libres:plazasLibres(dia, f), max:f.max, maq:Object.fromEntries(MAQ.map(m => [m.id, maqOcupada(dia, f, m)])), v:ver(dia, f.id), ...statsFranja(dia, f)};
  });
  descargarMes(dia);
  S.sync = Date.now();
  log('down', '↓ Descargado «' + fmtDia(dia) + '» (' + (motivo || 'al elegir el día') + ') · versiones ' + FRANJAS.map(f => f.id.slice(0,3) + ' v' + ver(dia, f.id)).join(' '));
}
const snapDe = (dia, fid) => (S.snap[dia] || {})[fid];
/* Descarga también los totales de comensales de todos los días del mes (para los números del calendario) */
S.snapMes = {};
function descargarMes(dia){
  const b = deClave(dia), ym = b.getFullYear() + '-' + b.getMonth(), nd = new Date(b.getFullYear(), b.getMonth() + 1, 0).getDate(), m = {};
  for (let d = 1; d <= nd; d++){ const k = clave(new Date(b.getFullYear(), b.getMonth(), d)); m[k] = totalDia(k); }
  S.snapMes[ym] = m;
}

/* ---------- El «servidor» de la sociedad: único que escribe; confirma o rechaza en orden ---------- */
function procesar(r){
  if (r.estado !== 'solicitada') return;
  const fr = FRANJAS.find(f => f.id === r.franja);
  const otras = S.reservas.filter(x => x !== r && x.dia===r.dia && x.franja===r.franja && x.estado==='confirmada');
  const ocup = ocupadosBase(r.dia, fr) + otras.reduce((s,x)=>s+x.comensales,0);
  const choque = r.maq.find(id => maqBase(r.dia, fr, MAQ.find(m=>m.id===id)) || otras.some(x => x.maq.includes(id)));
  if (r.dia === DIA_CERRADO) { r.estado='rechazada'; r.motivo='Ese día la sociedad está cerrada por un evento.'; }
  else if (ocup + r.comensales > fr.max) { r.estado='rechazada'; r.motivo='Ya no quedan plazas suficientes en ese turno.'; }
  else if (choque) { r.estado='rechazada'; r.motivo=MAQ.find(m=>m.id===choque).nombre+' ya está cogido en ese turno.'; }
  else { r.estado='confirmada'; r.idr = ++_idr; }   /* el número de Reserva nace al confirmarla el servidor */
  sube(r.dia, r.franja);
  log('down', '↓ La sociedad ha ' + (r.estado==='confirmada' ? 'confirmado la Reserva ' + r.idr : 'rechazado la solicitud (' + r.motivo + ')') + ' · ' + fmtDia(r.dia) + ' ' + r.franja);
  if (S.dia === r.dia) descargar(r.dia, 'tras la respuesta');
  guardar(); pintar();
}
function procesarCambio(r){   /* el servidor valida el cambio (comensales y aparatos) sin contar la propia reserva */
  if (!r.cambio || r.estado !== 'confirmada') return;
  const fr = FRANJAS.find(f => f.id === r.franja), c = r.cambio;
  const otras = S.reservas.filter(x => x !== r && x.dia===r.dia && x.franja===r.franja && x.estado==='confirmada');
  const ocup = ocupadosBase(r.dia, fr) + otras.reduce((s,x)=>s+x.comensales,0);
  const choque = c.maq.find(id => !r.maq.includes(id) && (maqBase(r.dia, fr, MAQ.find(m=>m.id===id)) || otras.some(x => x.maq.includes(id))));
  if (ocup + c.comensales > fr.max){ r.cambioMotivo = 'No se ha podido cambiar: ya no quedan plazas suficientes en ese turno.'; }
  else if (choque){ r.cambioMotivo = 'No se ha podido cambiar: ' + MAQ.find(m=>m.id===choque).nombre + ' ya está cogido en ese turno.'; }
  else { r.comensales = c.comensales; r.maq = c.maq.slice(); r.mods = (r.mods||0) + 1; r.cambioMotivo = ''; }
  r.cambio = null; sube(r.dia, r.franja);
  log('down', '↓ La sociedad ha ' + (r.cambioMotivo ? 'rechazado el cambio de la Reserva ' + r.idr + ' (' + r.cambioMotivo.replace('No se ha podido cambiar: ','') + ')' : 'aplicado el cambio de la Reserva ' + r.idr + ' · ' + r.comensales + ' pers.'));
  if (S.dia === r.dia) descargar(r.dia, 'tras la respuesta');
  guardar(); pintar();
}
function procesarPendientes(){
  S.reservas.filter(r => r.estado==='solicitada').forEach((r,i) => setTimeout(() => procesar(r), 600*(i+1)));
  S.reservas.filter(r => r.cambio).forEach((r,i) => setTimeout(() => procesarCambio(r), 600*(i+1)));
}

function textoCuenta(){ const s = Math.max(0, Math.floor((S.hasta - Date.now())/1000)); return Math.floor(s/3600)+' h '+String(Math.floor(s%3600/60)).padStart(2,'0')+' min'; }
function textoSync(){ if (!S.sync) return 'sin descargar'; const s = Math.floor((Date.now() - S.sync)/1000); return s < 5 ? 'ahora mismo' : 'hace ' + s + ' s'; }
function resumenTxt(){
  const fr = FRANJAS.find(f => f.id === S.franja);
  return {dia:S.dia ? fmtDia(S.dia) : null, fr, ok:!!(S.dia && fr)};
}
/* Calendario de mes (la semana empieza en lunes). Se pueden pasar de un mes a otro; los días pasados, los que están a más de 1 mes y los cerrados por un evento no se pueden elegir. El puntito marca los días en los que ya tienes reserva. */
function vCalendario(){
  const base = S.mes ? deClave(S.mes) : (() => { const d = hoy(); d.setDate(1); return d; })();
  const año = base.getFullYear(), mes = base.getMonth(), offset = (new Date(año, mes, 1).getDay() + 6) % 7, nd = new Date(año, mes + 1, 0).getDate();
  const maxD = sumar(hoy(), ANTELACION_DIAS), maxK = clave(maxD), minM = hoy().getFullYear() * 12 + hoy().getMonth(), maxM = maxD.getFullYear() * 12 + maxD.getMonth(), cur = año * 12 + mes;
  const propias = new Set(misReservas().filter(r => r.estado === 'confirmada' || r.estado === 'solicitada').map(r => r.dia));
  const celdas = []; for (let i = 0; i < offset; i++) celdas.push('<span></span>');
  for (let d = 1; d <= nd; d++){
    const k = clave(new Date(año, mes, d)), cerr = k === DIA_CERRADO, off = k < HOYK || k > maxK || cerr, tot = (S.snapMes[año + '-' + mes] || {})[k];
    celdas.push(`<button class="cd ${S.dia===k?'on':''} ${k===HOYK?'hoy':''} ${cerr?'cerr':''}" data-ac="dia" data-k="${k}" ${off?'disabled':''} ${cerr?'title="Cerrado por un evento"':tot?`title="${tot} comensales ya reservados"`:''}><b>${d}</b>${cerr?'<small>cerrado</small>':(tot && !off ? `<small class="oc">${tot}</small>` : '')}${propias.has(k)?'<i></i>':''}</button>`);
  }
  return `<div class="cal"><div class="calcab"><button data-ac="mes" data-d="-1" ${cur<=minM?'disabled':''} aria-label="Mes anterior">‹</button><b>${MESESL[mes]} ${año}</b><button data-ac="mes" data-d="1" ${cur>=maxM?'disabled':''} aria-label="Mes siguiente">›</button></div>
    <div class="calsem">${['L','M','X','J','V','S','D'].map(x => `<span>${x}</span>`).join('')}</div><div class="calgrid">${celdas.join('')}</div>
    <div class="calpie"><button data-ac="dia" data-k="${HOYK}">Hoy</button><button data-ac="dia" data-k="${clave(sumar(hoy(),1))}">Mañana</button><span><i></i> Ya tienes reserva</span></div>
    <div class="nota" style="margin:0">El número pequeño de cada día son los <b>comensales ya reservados</b>. El detalle de cada turno sale al elegir el día.</div>
    ${S.dia === DIA_CERRADO ? '<div class="error">Ese día la sociedad está cerrada por un evento.</div>' : ''}</div>`;
}
function vNueva(){
  const R = resumenTxt(), fr = R.fr, sn = S.dia && fr ? snapDe(S.dia, fr.id) : null, libres = sn ? sn.libres : 0;
  const max = Math.max(1, Math.min(99, libres)); if (S.com > max) S.com = max;
  const listo = !!(S.dia && fr && libres > 0 && S.dia !== DIA_CERRADO);
  const turnos = FRANJAS.map(f => { const s = S.dia ? snapDe(S.dia, f.id) : null, q = s ? s.libres : null, pct = s ? Math.round((1 - s.libres / s.max) * 100) : 0, cls = s ? (s.libres / s.max < .15 ? 'p' : s.libres / s.max < .4 ? 'm' : '') : '';
    return `<button class="turno ${S.franja===f.id?'on':''}" data-ac="franja" data-id="${f.id}" ${S.dia&&(q<=0||S.dia===DIA_CERRADO)?'disabled':''}><b>${f.nombre}</b><small>${f.desde}–${f.hasta}</small>${s?`<div class="barra ${cls}"><i style="width:${pct}%"></i></div><small>${q>0?'quedan '+q+' plazas':'completo'}</small><small>${s.res} reserva${s.res===1?'':'s'} · ${s.com} comensales</small>`:'<small>Elige primero el día</small>'}</button>`; }).join('');
  const aparatos = MAQ.map(m => { const oc = sn ? sn.maq[m.id] : false; return `<button class="aparato ${S.maq.includes(m.id)?'on':''}" data-ac="maq" data-id="${m.id}" ${oc?'disabled':''}>${m.nombre}<small>${!sn?'—':oc?'ocupado':'libre'}</small></button>`; }).join('');
  const maqTxt = S.maq.map(id => MAQ.find(m => m.id === id).nombre).join(', ');
  const resumen = `<div class="resumen"><h2>Tu reserva</h2>${listo ? `<dl><dt>Día</dt><dd>${R.dia}</dd><dt>Turno</dt><dd>${fr.nombre}</dd><dt>Comensales</dt><dd>${S.com}</dd><dt>Aparatos</dt><dd>${maqTxt || 'ninguno'}</dd></dl>` : '<div class="vacio">Elige día y turno para ver aquí el resumen.</div>'}
      <button class="btn" data-ac="solicitar" ${listo?'':'disabled'}>Solicitar reserva</button>
      <p class="nota">Se confirma cuando la sociedad la acepta. Si algo ya no está libre, te lo decimos con el motivo.</p></div>`;
  return `${S.enviada ? `<div class="ok" style="margin-bottom:14px">Solicitud enviada. ${S.conectado ? 'En unos segundos te decimos si está confirmada.' : 'La sociedad no está conectada ahora: queda <b>pendiente de confirmar</b> y se procesa cuando vuelva.'} Míralo en «Mis reservas».</div>` : ''}
  ${S.errNueva ? `<div class="aviso" style="margin-bottom:14px">${esc(S.errNueva)}</div>` : ''}
  <div class="cols"><div class="pasos">
    <div class="paso p-dia"><h2><i>1</i> Día</h2>${vCalendario()}</div>
    <div class="paso"><h2><i>2</i> Turno</h2><div class="turnos">${turnos}</div></div>
    <div class="paso"><h2><i>3</i> Comensales</h2><div class="stepper"><button data-ac="com" data-d="-1" aria-label="Menos">−</button><output>${S.com}</output><button data-ac="com" data-d="1" aria-label="Más">+</button></div>${listo ? `<div class="nota" style="margin-top:8px">Máximo ${max} (plazas libres de ese turno).</div>` : ''}</div>
    <div class="paso"><h2><i>4</i> Horno o freidora</h2><div class="aparatos">${aparatos}</div><div class="nota" style="margin-top:8px">Opcional. Una reserva por aparato y turno.</div></div>
  </div><div class="lado">${resumen}</div></div>
  <div class="movilbar"><div class="tx">${listo ? `${R.dia} · ${fr.nombre}<small>${S.com} comensal${S.com>1?'es':''}${maqTxt ? ' · ' + esc(maqTxt) : ''}</small>` : 'Elige día y turno'}</div><button class="btn" data-ac="solicitar" ${listo?'':'disabled'}>Solicitar</button></div>`;
}

    <p class="nota" style="margin-top:12px">Las reservas no se borran: si anulas una, queda anotada como anulada.</p>`;

/* Editar una reserva confirmada: comensales y aparatos (el día y el turno no se cambian: se anula y se pide otra). El cambio viaja como una petición y el servidor lo valida, igual que una reserva nueva. */

function vApp(){
  const pend = misReservas().filter(r => r.estado==='solicitada').length;
  return `<div class="cab"><div class="in"><div class="marca nombre">${NOMBRE}</div><div class="quien"><b>${esc(S.socio+' - '+SOCIOS[S.socio].nombre)}</b><small>Sesión abierta · caduca en <span id="cuenta">${textoCuenta()}</span></small></div><button class="bexp" data-ac="expandir" aria-label="Ocupar toda la pantalla">${iconoExp()}</button><button data-ac="salir">Salir</button></div></div>
  <div class="wrap"><div class="tabs"><button class="tab ${S.tab==='nueva'?'on':''}" data-ac="tab" data-t="nueva">Nueva reserva</button><button class="tab ${S.tab==='mis'?'on':''}" data-ac="tab" data-t="mis">Mis reservas${pend?`<b>${pend}</b>`:''}</button>
    <span class="sync">Datos de la sociedad: <b id="sync">${textoSync()}</b> <button data-ac="actualizar">Actualizar</button></span></div>
  ${S.tab==='nueva' ? vNueva() : vMis()}${vRegistro()}</div>`;
}
function pintar(){
  const f = document.activeElement, id = f && f.id, ini = f && f.selectionStart;
  const y = window.scrollY;
  const cuerpo = S.fase === 'app' ? vApp() : vLogin();
  const app = document.getElementById('app');
  app.classList.toggle('completa', S.completa);
  app.innerHTML = `<div class="demo"><span>Demostración · datos inventados</span><span class="bs"><button data-ac="conexion">Servidor de la sociedad: ${S.conectado ? 'conectado' : 'SIN conexión'}</button><button data-ac="otro">Otro socio reserva ahora</button><button data-ac="caducar">Simular que pasan 2 h</button></span></div>${cuerpo}<div class="pie">${esc(SOCIEDAD.nombre)} · ${esc(SOCIEDAD.sub)}</div>`;
  if (id){ const n = document.getElementById(id); if (n){ n.focus(); try{ n.setSelectionRange(ini, ini); }catch(e){} } }
  window.scrollTo(0, y);
  if (S.fase === 'app') guardar();
}

/* ---------- Acciones ---------- */
const normDni = s => s.toUpperCase().replace(/[\s.\-]/g, '');
const ACC = {
  entrar(){
    const n = parseInt(S.num, 10), dni = normDni(S.dni); S.error = ''; S.aviso = '';
    if (S.bloqueo[n] && Date.now() < S.bloqueo[n]){ S.error = 'Demasiados intentos. Espera unos minutos o habla con la junta.'; return; }
    const s = SOCIOS[n];
    if (!s || s.dni !== dni){
      S.intentos[n] = (S.intentos[n]||0) + 1;
      if (S.intentos[n] >= MAX_INTENTOS){ S.bloqueo[n] = Date.now() + 15*60000; S.intentos[n] = 0; S.error = 'Demasiados intentos. Espera unos minutos o habla con la junta.'; }
      else S.error = 'Número de socio o DNI incorrectos.';   /* siempre el mismo mensaje: no se dice cuál falla */
      return;
    }
    S.intentos[n] = 0; S.socio = n; S.hasta = Date.now() + HORAS_SESION*3600000; S.fase = 'app'; S.tab = 'nueva'; S.dia = ''; S.franja = ''; S.com = 2; S.maq = []; S.enviada = null; S.errNueva = ''; S.dni = ''; S.num = '';
    log('ot', '· Sesión abierta del socio ' + n + ' (solo para reservar)'); descargar(HOYK, 'al entrar: se resincroniza lo que hay');
  },
  salir(){ Object.assign(S, {fase:'login', socio:0, hasta:0, aviso:'Sesión cerrada. Hasta pronto.', error:'', enviada:null}); guardar(); },
  caducar(){ if (S.fase !== 'app') return; Object.assign(S, {fase:'login', socio:0, hasta:0, aviso:'Tu sesión ha caducado. Vuelve a entrar.', error:''}); guardar(); },
  expandir(){
    S.completa = !S.completa;
    try { if (S.completa && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); else if (!S.completa && document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch(e){}
  },
  conexion(){ S.conectado = !S.conectado; log('ot', S.conectado ? '· La sociedad vuelve a estar conectada: procesa lo pendiente en orden' : '· La sociedad se queda sin conexión: las solicitudes esperan en la cola'); if (S.conectado) procesarPendientes(); },
  reg(){ S.regAbierto = !S.regAbierto; return; },
  tab(el){ S.tab = el.dataset.t; S.enviada = null; S.anularId = null; },
  actualizar(){ if (S.dia) descargar(S.dia, 'a mano'); else { S.sync = Date.now(); log('down', '↓ Descargado lo existente (todavía sin día elegido)'); } S.errNueva = ''; revisa(); },
  dia(el){ S.dia = el.dataset.k; S.mes = clave(new Date(deClave(S.dia).getFullYear(), deClave(S.dia).getMonth(), 1)); S.enviada = null; S.errNueva = ''; descargar(S.dia); revisa(); },
  franja(el){ S.franja = el.dataset.id; S.enviada = null; S.errNueva = ''; revisa(); },
  com(el){ S.com = Math.max(1, S.com + parseInt(el.dataset.d, 10)); S.enviada = null; },
  maq(el){ const id = el.dataset.id; S.maq = S.maq.includes(id) ? S.maq.filter(x => x !== id) : S.maq.concat(id); S.enviada = null; },
  solicitar(){
    if (!S.dia || !S.franja) return;
    /* Antes de escribir se comprueba la versión: si la sociedad ha cambiado ese turno desde que lo descargamos, error y a descargar otra vez */
    const vista = S.vistas[vk(S.dia, S.franja)] || 0, actual = ver(S.dia, S.franja);
    if (actual > vista){
      log('err', '✕ Conflicto: descargado v' + vista + ', ahora hay v' + actual + ' en «' + fmtDia(S.dia) + ' ' + S.franja + '». No se escribe nada.');
      S.errNueva = 'Mientras elegías, ese turno ha cambiado en la sociedad (otra reserva). Hemos descargado los datos otra vez: revisa lo que queda libre y vuelve a pedirla.';
      descargar(S.dia, 'tras el conflicto'); revisa(); return;
    }
    const r = {creada:Date.now(), socio:S.socio, dia:S.dia, franja:S.franja, comensales:S.com, maq:S.maq.slice(), estado:'solicitada', idr:null, motivo:'', base:vista};
    S.reservas.push(r); sube(r.dia, r.franja);
    log('up', '↑ Solicitud enviada (basada en v' + vista + '): ' + fmtDia(r.dia) + ' ' + r.franja + ' · ' + r.comensales + ' pers.' + (r.maq.length ? ' · ' + r.maq.join('+') : ''));
    S.enviada = true; S.errNueva = ''; const d = S.dia; S.dia = ''; S.franja = ''; S.com = 2; S.maq = [];
    if (S.conectado) setTimeout(() => procesar(r), 1500); else log('ot', '· La sociedad no responde: la solicitud queda pendiente en la cola');
  },
  mes(el){ const b = S.mes ? deClave(S.mes) : (() => { const d = hoy(); d.setDate(1); return d; })(); S.mes = clave(new Date(b.getFullYear(), b.getMonth() + parseInt(el.dataset.d, 10), 1)); descargarMes(S.mes); S.sync = Date.now(); log('down', '↓ Descargado el calendario de ' + MESESL[deClave(S.mes).getMonth()] + ' (comensales ya reservados de cada día)'); },
  editar(el){ const r = S.reservas.find(x => x.creada === +el.dataset.id); if (!r) return; S.editId = r.creada; S.anularId = null; S.errEdit = ''; r.cambioMotivo = ''; S.edit = {com:r.comensales, maq:r.maq.slice()}; descargar(r.dia, 'al editar la Reserva ' + r.idr); },
  edcom(el){ const r = S.reservas.find(x => x.creada === S.editId), sn = snapDe(r.dia, r.franja), max = Math.max(1, Math.min(99, (sn ? sn.libres : 0) + r.comensales)); S.edit.com = Math.max(1, Math.min(max, S.edit.com + parseInt(el.dataset.d, 10))); },
  edmaq(el){ const id = el.dataset.id; S.edit.maq = S.edit.maq.includes(id) ? S.edit.maq.filter(x => x !== id) : S.edit.maq.concat(id); },
  edcancelar(){ S.editId = null; S.edit = null; S.errEdit = ''; },
  edguardar(){
    const r = S.reservas.find(x => x.creada === S.editId); if (!r) return;
    const vista = S.vistas[vk(r.dia, r.franja)] || 0, actual = ver(r.dia, r.franja);
    if (actual > vista){   /* misma comprobación que al reservar: si Redis es más nuevo, no se escribe */
      log('err', '✕ Conflicto al editar: descargado v' + vista + ', ahora hay v' + actual + '. No se escribe nada.');
      S.errEdit = 'Mientras editabas, ese turno ha cambiado en la sociedad. Hemos descargado los datos otra vez: revisa lo que queda libre y vuelve a guardar.';
      descargar(r.dia, 'tras el conflicto');
      const sn = snapDe(r.dia, r.franja); S.edit.maq = S.edit.maq.filter(id => r.maq.includes(id) || !sn.maq[id]); S.edit.com = Math.min(S.edit.com, Math.max(1, sn.libres + r.comensales)); return;
    }
    if (S.edit.com === r.comensales && S.edit.maq.slice().sort().join() === r.maq.slice().sort().join()){ S.editId = null; S.edit = null; return; }
    r.cambio = {comensales:S.edit.com, maq:S.edit.maq.slice(), base:vista}; sube(r.dia, r.franja);
    log('up', '↑ Cambio enviado de la Reserva ' + r.idr + ' (basado en v' + vista + '): ' + r.cambio.comensales + ' pers.' + (r.cambio.maq.length ? ' · ' + r.cambio.maq.join('+') : ' · sin aparatos'));
    S.editId = null; S.edit = null; S.errEdit = '';
    if (S.conectado) setTimeout(() => procesarCambio(r), 1500); else log('ot', '· La sociedad no responde: el cambio queda pendiente en la cola');
  },
  anular(el){ S.anularId = +el.dataset.id; S.editId = null; },
  noAnular(){ S.anularId = null; },
  siAnular(el){ const r = S.reservas.find(x => x.creada === +el.dataset.id); if (r){ r.estado = 'anulada'; r.motivo = 'Anulada por ti.'; sube(r.dia, r.franja); log('up', '↑ Anulación enviada: ' + fmtDia(r.dia) + ' ' + r.franja); } S.anularId = null; },
  otro(){   /* demo: otra persona (o la TPV, o el panel) reserva en la sociedad mientras tú estás eligiendo */
    const re = S.editId && S.reservas.find(x => x.creada === S.editId);   /* si estás editando una reserva, el otro socio reserva en ese mismo turno */
    const dia = re ? re.dia : (S.dia || HOYK), fid = re ? re.franja : (S.franja || (FRANJAS.find(f => plazasLibres(dia, f) > 6) || FRANJAS[0]).id), fr = FRANJAS.find(f => f.id === fid);
    const n = Math.min(plazasLibres(dia, fr), 6); if (n <= 0 || dia === DIA_CERRADO) return;
    S.reservas.push({creada:Date.now(), socio:0, dia, franja:fid, comensales:n, maq:[], estado:'confirmada', idr:++_idr, motivo:''});
    sube(dia, fid); log('ot', '· Otro socio (o la TPV) reserva ' + n + ' plazas en «' + fmtDia(dia) + ' ' + fid + '» y actualiza Redis: la versión sube a v' + ver(dia, fid) + '. Esta pantalla NO se entera hasta que vuelva a sincronizar.');
  }
};
function revisa(){   /* si lo elegido ya no está libre (según lo descargado), se quita */
  const sn = S.dia && S.franja ? snapDe(S.dia, S.franja) : null;
  if (S.dia === DIA_CERRADO){ S.franja = ''; S.maq = []; return; }
  if (sn){ if (sn.libres <= 0) S.franja = ''; S.maq = S.maq.filter(id => !sn.maq[id]); }
}
document.addEventListener('click', e => { const el = e.target.closest('[data-ac]'); if (!el || el.disabled || !ACC[el.dataset.ac]) return; const ant = S.regAbierto; ACC[el.dataset.ac](el); if (el.dataset.ac === 'reg'){ e.preventDefault(); } pintar(); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'num'){ S.num = t.value.replace(/\D/g, '').slice(0, 5); t.value = S.num; }
  else if (t.id === 'dni') S.dni = t.value;
  else if (t.id === 'fecha'){ const v = t.value; if (v && v >= HOYK && v <= clave(sumar(hoy(), ANTELACION_DIAS))){ S.dia = v; S.enviada = null; S.errNueva = ''; descargar(S.dia, 'al elegir otro día'); revisa(); pintar(); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && S.fase === 'login' && (e.target.id === 'num' || e.target.id === 'dni')){ ACC.entrar(); pintar(); } });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && S.completa){ S.completa = false; pintar(); } });
/* Cada segundo solo se actualiza el texto de la cuenta atrás y del «hace N s». NO hay refresco automático (ni cron): se resincroniza al entrar, al elegir día, al pulsar Actualizar y cuando hay un conflicto de versión. */
setInterval(() => {
  if (S.fase !== 'app') return;
  if (Date.now() > S.hasta){ ACC.caducar(); pintar(); return; }
  const c = document.getElementById('cuenta'); if (c) c.textContent = textoCuenta();
  const s = document.getElementById('sync'); if (s) s.textContent = textoSync();
}, 1000);
pintar();
if (S.fase === 'app') procesarPendientes();
</script>
